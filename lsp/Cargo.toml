[package]
name = "mermaid-quicklook-lsp"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Language server that previews Mermaid diagrams as an image tab in Zed"

[[bin]]
name = "mermaid-quicklook-lsp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
libc = "0.2"
lsp-server = "0.7"
lsp-types = "0.95"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
wait-timeout = "0.2"
which = "6"
